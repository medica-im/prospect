<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Désabonnement{% endblock %} — Médecine Libre</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #1f6feb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --card: #1c2027;
        --text: #e8eaed;
        --muted: #9aa3af;
        --border: #2c313a;
        --accent: #6ea8fe;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 34rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 1.5rem;
      line-height: 1.3;
      font-weight: 600;
    }
    p { margin: 0 0 1rem; }
    .email {
      display: inline-block;
      max-width: 100%;
      overflow-wrap: anywhere;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9rem;
    }
    .muted { color: var(--muted); font-size: 0.9rem; }
    button {
      appearance: none;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      padding: 0.75rem 1.5rem;
      margin: 0.5rem 0;
    }
    button:hover { opacity: 0.9; }
    a { color: var(--accent); }
    .footer {
      margin: 1.5rem 0 0;
      padding: 1.25rem 0 0;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main class="card">
    {% block content %}{% endblock %}
    <div class="footer">
      <p class="muted" style="margin:0;">
        <a href="https://medecinelibre.com">medecinelibre.com</a>
      </p>
    </div>
  </main>
</body>
</html>
